name: BADP Cloud Development Fixture
on:
  pull_request:
    paths:
      - 'scripts/cloud-development-fixture.mjs'
      - 'src/**'
      - 'db/**'
      - '.github/workflows/cloud-development-fixture.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/cloud-development-fixture.mjs
