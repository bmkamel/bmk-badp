name: BADP Source Live Pilot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-live-pilot.yml'
      - 'scripts/source-live-pilot.mjs'
      - 'scripts/publish-source-pilot.mjs'
      - 'src/pilot-policy.mjs'
permissions:
  contents: read
concurrency:
  group: badp-source-pilot
  cancel-in-progress: false
jobs:
  pilot:
    if: github.ref == 'refs/heads/main' && vars.BADP_LIVE_DEMO_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      proposal_ready: ${{ steps.generate.outputs.proposal_ready }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pull immutable sandbox image
        run: |
          docker pull docker.io/library/node:22-bookworm-slim
          image=$(docker image inspect docker.io/library/node:22-bookworm-slim --format '{{index .RepoDigests 0}}')
          [[ "$image" =~ ^(docker\.io/library/)?node@sha256:[a-f0-9]{64}$ ]] || exit 2
          printf 'BADP_SMOKE_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"
      - name: Generate and verify proposal
        id: generate
        env:
          BADP_FREE_CONFIRMED: 'true'
          BADP_GROQ_FREE_VERIFIED: 'true'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BADP_PILOT_OUTPUT: ${{ runner.temp }}/source-review.json
        run: |
          node scripts/source-live-pilot.mjs
          if test -f "$BADP_PILOT_OUTPUT"; then echo 'proposal_ready=true' >> "$GITHUB_OUTPUT"; fi
      - if: steps.generate.outputs.proposal_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-review
          path: ${{ runner.temp }}/source-review.json
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: pilot
    if: github.ref == 'refs/heads/main' && needs.pilot.result == 'success' && needs.pilot.outputs.proposal_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: source-review
          path: ${{ runner.temp }}/badp-publish
      - name: Publish verified proposal
        env:
          GH_TOKEN: ${{ github.token }}
          BADP_PILOT_OUTPUT: ${{ runner.temp }}/badp-publish/source-review.json
        run: node scripts/publish-source-pilot.mjs
