name: BADP Source Live Pilot
on:
  workflow_dispatch:
    inputs:
      image_digest:
        type: string
        required: true
      free_budget_confirmed:
        type: boolean
        default: false
      groq_free_verified:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: badp-source-pilot
  cancel-in-progress: false
jobs:
  pilot:
    if: github.ref == 'refs/heads/main' && inputs.free_budget_confirmed && inputs.groq_free_verified && vars.BADP_LIVE_DEMO_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pull immutable sandbox image
        env:
          BADP_SMOKE_IMAGE: ${{ inputs.image_digest }}
        run: |
          [[ "$BADP_SMOKE_IMAGE" =~ ^(docker\.io/library/)?node@sha256:[a-f0-9]{64}$ ]] || exit 2
          docker pull "$BADP_SMOKE_IMAGE"
      - name: Generate and verify proposal
        env:
          BADP_SMOKE_IMAGE: ${{ inputs.image_digest }}
          BADP_FREE_CONFIRMED: 'true'
          BADP_GROQ_FREE_VERIFIED: 'true'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BADP_PILOT_OUTPUT: ${{ runner.temp }}/source-review.json
        run: node scripts/source-live-pilot.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-review
          path: ${{ runner.temp }}/source-review.json
          retention-days: 1
          if-no-files-found: error
