name: BADP Cloud Live Demo
on:
  workflow_dispatch:
    inputs:
      provider:
        type: choice
        options: [openrouter, groq, hybrid]
        default: openrouter
      groq_free_verified:
        type: boolean
        default: false
      free_budget_confirmed:
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: badp-live-demo
  cancel-in-progress: false
jobs:
  demo:
    if: github.ref == 'refs/heads/main' && inputs.free_budget_confirmed && vars.BADP_LIVE_DEMO_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set review artifact path
        run: echo "BADP_REVIEW_DIR=$RUNNER_TEMP/badp-review" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: inputs.provider == 'openrouter'
        run: node scripts/cloud-live-demo.mjs
        env:
          BADP_DEMO_PROVIDER: openrouter
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BADP_FREE_CONFIRMED: 'true'
      - if: inputs.provider == 'groq' && inputs.groq_free_verified
        run: node scripts/cloud-live-demo.mjs
        env:
          BADP_DEMO_PROVIDER: groq
          BADP_GROQ_FREE_VERIFIED: 'true'
          BADP_FREE_CONFIRMED: 'true'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - if: inputs.provider == 'hybrid' && inputs.groq_free_verified
        run: node scripts/cloud-live-demo.mjs
        env:
          BADP_DEMO_PROVIDER: hybrid
          BADP_GROQ_FREE_VERIFIED: 'true'
          BADP_FREE_CONFIRMED: 'true'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - if: inputs.provider != 'openrouter' && !inputs.groq_free_verified
        run: exit 1
      - if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: badp-review
          path: ${{ runner.temp }}/badp-review/review.json
          if-no-files-found: error
          retention-days: 1
